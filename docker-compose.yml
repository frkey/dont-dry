services:
  dont-dry:
    image: ghcr.io/frkey/dont-dry:latest
    # build: .                       # or build locally instead of pulling
    container_name: dont-dry
    restart: unless-stopped
    env_file: .env
    # dont-dry needs no privileges and writes only its heartbeat to /tmp
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
