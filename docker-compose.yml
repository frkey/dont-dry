services:
  dont-dry:
    image: ghcr.io/frkey/dont-dry:latest
    # build: .                       # or build locally instead of pulling
    container_name: dont-dry
    restart: unless-stopped
    env_file: .env
    environment:
      STATE_DIR: /var/lib/dont-dry
    # dont-dry needs no privileges and writes only to its state volume
    read_only: true
    tmpfs:
      - /tmp
    # Remembers the last print across restarts. A host folder instead must be writable by uid 10001.
    volumes:
      - state:/var/lib/dont-dry
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"

volumes:
  state:
