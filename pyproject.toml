[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dont-dry"
dynamic = ["version"]
description = "Print a maintenance page on a schedule so inkjet printheads don't dry out (IPP / AirPrint, no drivers)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.1",
    "tzdata",
]
keywords = ["printer", "inkjet", "ipp", "airprint", "homelab", "maintenance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Printing",
]

[project.optional-dependencies]
dev = ["pytest>=7", "tomli>=2; python_version < '3.11'"]

[project.scripts]
dont-dry = "dont_dry.cli:main"

[project.urls]
Homepage = "https://github.com/frkey/dont-dry"
Issues = "https://github.com/frkey/dont-dry/issues"
Changelog = "https://github.com/frkey/dont-dry/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "dont_dry.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dont_dry = ["locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
