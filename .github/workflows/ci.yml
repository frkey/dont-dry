name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"  # Mondays: the audit also catches advisories published since the last push

# Read-only token; only the image and release jobs ask for more, to publish
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # CI's tools come pinned with hashes too, in the versions servers install
      - run: |
          pip install --require-hashes -r .github/requirements-ci.txt
          pip install --no-deps --no-build-isolation -e .
      - run: pytest -q
      - name: Render the test page
        run: |
          mkdir -p output
          dont-dry render output/page-a4.png
          PAGE_SIZE=letter dont-dry render output/page-letter.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: matrix.python == '3.13'
        with:
          name: test-page
          path: output/*.png

  # The pinned versions the image and the systemd install use: they install the way the
  # Dockerfile installs them, pass the tests and have no known vulnerabilities
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"  # the image's
      - name: Install as the Dockerfile does
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r deploy/requirements.txt
          .venv/bin/pip install --no-deps --no-build-isolation .
          .venv/bin/pip check
      - run: |
          .venv/bin/pip install --require-hashes -r .github/requirements-ci.txt
          .venv/bin/pytest -q
      - run: .venv/bin/pip-audit --disable-pip --require-hashes -r deploy/requirements.txt

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck deploy/*.sh deploy/proxmox/*.sh .github/scripts/*.sh

  # deploy/install.sh from this commit on a real Ubuntu with systemd, against the fake printer:
  # a first install with a test page, then an update that must keep the settings
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Start a fake printer
        run: |
          pip install --require-hashes -r .github/requirements-ci.txt
          pip install --no-deps --no-build-isolation -e .
          python -m tests.fake_printer 8631 > fake-printer.log 2>&1 &
      - name: First install, with a test page
        run: |
          git switch --create ci-install
          sudo git config --global --add safe.directory '*'
          sudo env DONT_DRY_REPO="$PWD" bash deploy/install.sh --ref ci-install \
            --printer ipp://127.0.0.1:8631/ipp/print --timezone America/Sao_Paulo --test-print
          grep "job 1: application/pdf" fake-printer.log
          systemctl is-active dont-dry
          sudo grep '"sent": true' /var/lib/dont-dry/last-run.json
      - name: Update keeps the settings
        run: |
          sudo cp /etc/dont-dry.env settings-before
          sudo bash /opt/dont-dry/deploy/install.sh
          sudo cmp settings-before /etc/dont-dry.env
          test "$(sudo stat -c %a /etc/dont-dry.env)" = 600
          systemctl is-active dont-dry
          sudo dont-dry info

  # The release path of deploy/install.sh: signed and unsigned tags, an update through the new
  # release's installer, a downgrade (throwaway key; see the script)
  release-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Start a fake printer
        run: |
          pip install --require-hashes -r .github/requirements-ci.txt
          pip install --no-deps --no-build-isolation -e .
          python -m tests.fake_printer 8631 > fake-printer.log 2>&1 &
      - run: sudo bash .github/scripts/test-release-install.sh ipp://127.0.0.1:8631/ipp/print

  image:
    needs: [tests, lock, scripts, install, release-install]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # A tag publishes :X.Y.Z and :latest only when it is a signed dont-dry release
      - name: Verify the release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: .github/scripts/verify-release-tag.sh "$GITHUB_REF_NAME"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: dont-dry:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker run --rm dont-dry:test --version
          docker run --rm --read-only --tmpfs /tmp dont-dry:test next
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # latest and X.Y.Z come only from release tags; master is published as "edge"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=master
            type=sha,format=short
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      # Checked with: gh attestation verify oci://ghcr.io/frkey/dont-dry:latest --owner frkey
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # A signed release tag gets its GitHub release, with the changelog section as notes and the
  # two install scripts attached, so the documented first-run commands fetch the release's code
  release:
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/verify-release-tag.sh "$GITHUB_REF_NAME"
      - name: Publish the release and its install scripts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          cp deploy/install.sh deploy/proxmox/create-lxc.sh .
          sha256sum install.sh create-lxc.sh > SHA256SUMS
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next}
              on && (/^## \[/ || /^\[Unreleased\]:/) {exit} on' CHANGELOG.md > notes.md
            gh release create "$TAG" --verify-tag --title "dont-dry $VERSION" --notes-file notes.md
          fi
          gh release upload "$TAG" install.sh create-lxc.sh SHA256SUMS --clobber
